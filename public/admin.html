<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard | Microsite Fasilitator</title>
  
  <link rel="icon" href="/favicon.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Ikon -->
  <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
  <link rel="stylesheet" href="style.css">

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body class="p-4 md:p-8 max-w-7xl mx-auto">

<div id="loadingScreen"><div class="loader"></div></div>

<!-- HEADER -->
<div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 animate-[fadeIn_0.5s_ease-out]">
  <div>
    <h1 class="text-3xl font-bold glow-text flex items-center gap-2">
      <i class='bx bxs-dashboard'></i> Dashboard Admin
    </h1>
    <p class="opacity-70 mt-1">Kelola dan pantau microsite fasilitator.</p>
  </div>
  <button class="mt-4 md:mt-0 bg-red-500/20 hover:bg-red-500/40 text-red-300 border border-red-500/30 px-4 py-2 rounded-xl flex items-center gap-2 font-medium" onclick="firebase.auth().signOut()">
    <i class='bx bx-log-out'></i> Keluar
  </button>
</div>

<!-- GRID -->
<div class="grid lg:grid-cols-12 gap-8">

  <!-- LEFT: FORM -->
  <div class="lg:col-span-4 glass p-6 rounded-3xl h-fit">
    <h2 class="text-xl font-bold mb-6 flex items-center gap-2 border-b border-white/10 pb-3">
      <i class='bx bx-layer-plus text-sky-400'></i> Buat / Edit Microsite
    </h2>

    <div class="space-y-4 mb-6">
      <div>
        <label class="text-xs font-semibold opacity-70 ml-1 mb-1 block">URL Slug (Tanpa spasi)</label>
        <input id="slug" placeholder="contoh-slug-baru" class="w-full p-3 text-gray-800 rounded-xl bg-white shadow-inner">
      </div>
      <div>
        <label class="text-xs font-semibold opacity-70 ml-1 mb-1 block">Judul Microsite</label>
        <input id="title" placeholder="Judul Halaman" class="w-full p-3 text-gray-800 rounded-xl bg-white shadow-inner">
      </div>
      <div>
        <label class="text-xs font-semibold opacity-70 ml-1 mb-1 block">Deskripsi Singkat</label>
        <input id="desc" placeholder="Deskripsi atau sub-judul" class="w-full p-3 text-gray-800 rounded-xl bg-white shadow-inner">
      </div>
      <div>
        <label class="text-xs font-semibold opacity-70 ml-1 mb-1 block">Kategori Microsite</label>
        <select id="micrositeCategory" class="w-full p-3 text-gray-800 rounded-xl bg-white shadow-inner font-medium">
          <option value="OPD">🏢 OPD</option>
          <option value="Kecamatan">🏘️ Kecamatan</option>
          <option value="Dokumen">📄 Dokumen</option>
          <option value="FASILITATOR">🛡️ FASILITATOR</option>
          <option value="Publik">🌐 Publik</option>
          <option value="Lainnya">📁 Lainnya</option>
        </select>
      </div>
    </div>

    <!-- DAFTAR LINK MANAGER -->
    <div class="bg-black/20 p-4 rounded-2xl mb-6 border border-white/5">
      <div class="flex justify-between items-center mb-4">
        <h3 class="text-sm font-semibold flex items-center gap-1"><i class='bx bx-link-alt'></i> Tautan (Links)</h3>
        <button onclick="addLink()" class="bg-sky-500 hover:bg-sky-600 text-white px-3 py-1.5 rounded-lg text-sm font-semibold flex items-center gap-1 shadow-lg shadow-sky-500/30">
          <i class='bx bx-plus'></i> Tambah
        </button>
      </div>
      
      <!-- Filter Link -->
      <input type="text" id="linkSearch" placeholder="Cari link..." class="w-full p-2.5 text-gray-800 rounded-xl text-sm mb-3 bg-white">
      <div id="links" class="space-y-2 max-h-[300px] overflow-y-auto pr-2"></div>
    </div>

    <button onclick="save()" class="w-full bg-gradient-to-r from-sky-500 to-indigo-500 hover:from-sky-600 hover:to-indigo-600 text-white font-bold py-3.5 rounded-xl shadow-lg shadow-sky-500/25 flex justify-center items-center gap-2">
      <i class='bx bx-save text-xl'></i> Simpan Data
    </button>
  </div>

  <!-- RIGHT: DATA LIST -->
  <div class="lg:col-span-8">
    <div class="glass p-6 rounded-3xl mb-6">
      <div class="flex flex-col md:flex-row md:items-center justify-between mb-4 gap-4">
        <h2 class="text-xl font-bold flex items-center gap-2">
          <i class='bx bx-server text-indigo-400'></i> Database Microsite
        </h2>
        <div class="relative w-full md:w-64">
          <i class='bx bx-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-500 text-lg'></i>
          <input type="text" id="searchInput" placeholder="Cari microsite..." class="w-full pl-10 p-2.5 text-gray-800 rounded-xl bg-white text-sm">
        </div>
      </div>
      
      <!-- Filter Tags -->
      <div class="flex flex-wrap gap-2" id="micrositeCategoryFilters">
        <button class="ms-cat-filter-btn px-3 py-1.5 rounded-full text-xs font-semibold bg-white/20 hover:bg-white/30 text-white transition-all border border-white/10" data-cat="OPD">OPD</button>
        <button class="ms-cat-filter-btn px-3 py-1.5 rounded-full text-xs font-semibold bg-white/20 hover:bg-white/30 text-white transition-all border border-white/10" data-cat="Kecamatan">Kecamatan</button>
        <button class="ms-cat-filter-btn px-3 py-1.5 rounded-full text-xs font-semibold bg-white/20 hover:bg-white/30 text-white transition-all border border-white/10" data-cat="Dokumen">Dokumen</button>
        <button class="ms-cat-filter-btn px-3 py-1.5 rounded-full text-xs font-semibold bg-white/20 hover:bg-white/30 text-white transition-all border border-white/10" data-cat="FASILITATOR">FASILITATOR</button>
        <button class="ms-cat-filter-btn px-3 py-1.5 rounded-full text-xs font-semibold bg-white/20 hover:bg-white/30 text-white transition-all border border-white/10" data-cat="Publik">Publik</button>
      </div>
    </div>

    <!-- List -->
    <div id="list" class="grid md:grid-cols-2 gap-4"></div>
  </div>
</div>

<!-- Modal Link (Tetap Sama, disesuaikan desainnya) -->
<div id="modalLink" class="hidden fixed inset-0 bg-slate-900/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
  <div class="bg-[#1e293b] border border-white/10 p-6 rounded-3xl w-full max-w-sm shadow-2xl">
    <h2 class="text-lg font-bold mb-5 flex items-center gap-2"><i class='bx bx-link text-sky-400'></i> Kelola Tautan</h2>
    <div class="space-y-4 mb-6">
      <input id="linkName" placeholder="Nama Link" class="w-full p-3 text-gray-800 rounded-xl">
      <input id="linkUrl" placeholder="https://..." class="w-full p-3 text-gray-800 rounded-xl">
      <select id="linkCategory" class="w-full p-3 text-gray-800 rounded-xl font-medium">
        <option value="Dokumen">📄 Dokumen</option>
        <option value="Website">🌐 Website</option>
        <option value="Spreadsheet">📊 Spreadsheet</option>
        <option value="Drive">📂 Drive</option>
        <option value="Lainnya">🔗 Lainnya</option>
      </select>
    </div>
    <div class="flex gap-3 justify-end">
      <button onclick="closeModal()" class="px-5 py-2.5 rounded-xl font-semibold bg-white/10 hover:bg-white/20">Batal</button>
      <button onclick="saveLink()" class="px-5 py-2.5 rounded-xl font-semibold bg-sky-500 hover:bg-sky-600 text-white shadow-lg shadow-sky-500/30">Simpan</button>
    </div>
  </div>
</div>

<script src="admin.js"></script>

<!-- Logika Filter (Disederhanakan untuk UI baru) -->
<script>
  // Sama dengan logika aslimu, tapi sesuaikan class tombol aktifnya dengan Tailwind
  // Contoh: aktif = bg-sky-500 border-sky-400
  document.querySelectorAll('.ms-cat-filter-btn').forEach(btn => {
    btn.classList.add('bg-sky-500', 'border-sky-400'); // Default aktif
    btn.addEventListener('click', function() {
       this.classList.toggle('bg-sky-500');
       this.classList.toggle('border-sky-400');
       this.classList.toggle('bg-white/20');
       // ... trigger applyMicrositeFilters() dari script lama kamu
    });
  });
</script>
</body>
</html>
